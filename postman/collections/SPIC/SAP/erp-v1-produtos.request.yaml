$kind: http-request
name: erp/v1/produtos
url: https://api.spicbrasil.com.br/erp/v1/centros/3000/produtos?$skip=0&$top=20000
method: GET
headers:
  - key: Authorization
    value: Bearer {{ACCESS_TOKEN}}
    disabled: false
  - key: $skip
    value: "0"
    disabled: true
  - key: $top
    value: "10"
    disabled: true
queryParams:
  $skip: "0"
  $top: "20000"
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();
      const produtos = jsonData.centros[0].produtos;
      const countProdutos = produtos.length; 

      console.log('Total de registros em produtos (centros[0]):', countProdutos);

      pm.test('Total de registros em produtos (centros[0]): ' + countProdutos, () => {
          pm.expect(countProdutos).to.be.above(-1);
      });
    language: text/javascript
settings: {}
order: 9000
