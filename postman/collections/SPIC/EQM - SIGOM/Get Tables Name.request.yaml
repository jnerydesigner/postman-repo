    code: |-
      const jsonData = pm.response.json();
      const count = jsonData.length;
      const hourCall = Math.round(count / 3);

      console.log("Total de tabelas retornadas: " + count);
      console.log("Total calls in per day: "+ hourCall)

      pm.test("Total de tabelas retornadas: " + count, function () {
          pm.expect(jsonData).to.be.an('array');
          pm.expect(count).to.be.above(0);
