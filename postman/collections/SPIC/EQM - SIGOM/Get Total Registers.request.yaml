$kind: http-request
url: https://api.spicbrasil.com.br/eqmdata/v1/bi_equipe/total-registros
method: GET
headers:
  authorization: Bearer {{ACCESS_TOKEN_SIGOM}}
  content-type: application/json
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();
      const count = jsonData.length;

      console.log("Total de tabelas retornadas: " + count);

      pm.test("Total de tabelas retornadas: " + count, function () {
          pm.expect(jsonData).to.be.an('array');
          pm.expect(count).to.be.above(0);
      });
    language: text/javascript
settings: {}
order: 6000
