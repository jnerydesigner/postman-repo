  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 5353,
        "nome": "string",
        "login": "string",
        "email": "string",
        "token": "string",
        "perfil": "string",
        "permissoes": [
          {
            "modulo": "string",
            "entidade": "string",
            "podeVizualizar": true,
            "podeAlterar": false,
            "podeCriar": true,
            "podeRemover": true,
            "podeExecutar": false
          },
          {
            "modulo": "string",
            "entidade": "string",
            "podeVizualizar": false,
            "podeAlterar": true,
            "podeCriar": true,
            "podeRemover": true,
            "podeExecutar": false
          }
        ]
      }
