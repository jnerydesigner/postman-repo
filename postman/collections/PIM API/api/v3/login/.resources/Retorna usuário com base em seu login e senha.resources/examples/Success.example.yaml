$kind: http-example
request:
  url: "{{baseUrl}}/api/v3/login"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: PIM-Auth
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "password": "string",
        "username": "string",
        "requirePermissions": false
      }
