$kind: http-request
url: "{{urlBaseDirectus}}/auth/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "jander.webmaster@gmail.com",
      "password": "Jcn526379181005@#"
    }
scripts:
  - type: afterResponse
    code: |
      
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response body contains a data object", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("data");
          pm.expect(jsonData.data).to.be.an("object");
      });

      pm.test("data.access_token exists and is a non-empty string", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property("access_token");
          pm.expect(jsonData.data.access_token).to.be.a("string").and.to.not.be.empty;
      });

      pm.test("data.refresh_token exists and is a non-empty string", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property("refresh_token");
          pm.expect(jsonData.data.refresh_token).to.be.a("string").and.to.not.be.empty;
      });

      pm.test("data.expires exists and is a number", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property("expires");
          pm.expect(jsonData.data.expires).to.be.a("number");
      });

      // Save access_token to environment variable
      const jsonData = pm.response.json();
      if (jsonData.data && jsonData.data.access_token) {
          pm.environment.set("token", jsonData.data.access_token);
      }
    language: text/javascript
settings: {}
order: 1000
