$kind: http-request
name: Client Credentials Token <oauth RFC 6749>
url: "{{url-environment}}/rfc-oauth/v1/access-token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Authorization: Basic {{Authorization}}
body:
  type: urlencoded
  content:
    grant_type: client_credentials
scripts:
  - type: afterResponse
    code: |-
      //GET 'access_token' = 'client-id:access-token' (base64)
      const body = JSON.parse(responseBody);
      var accessTokenBase64 = body.access_token;
      postman.setEnvironmentVariable("access_token", accessTokenBase64);

      //GET only 'access_token' (no base64)
      var decodeBase64 = atob(accessTokenBase64);
      const accessTokenDecode = decodeBase64.split(':')[1];
      postman.setEnvironmentVariable("access_token_decode", accessTokenDecode);

      //tests["client-id:access-token Base64 => " + accessTokenBase64] = true;
      tests["          access-token decode => " + accessTokenDecode] = true;
    language: text/javascript
settings:
  strictSSL: true
  followRedirects: false
order: 3000
